# Keeps the Render free-tier API awake: Render puts the service to sleep after
# ~15 minutes without traffic, and waking it takes ~30-60 s (socket errors and
# slow first loads). Pinging /health every 10 minutes prevents that.
#
# Notes:
# - GitHub may delay scheduled runs by a few minutes; 10 min leaves margin.
# - Runs only in Kigena/neurotrace-academy (the mirror repo would double-ping).
# - GitHub disables scheduled workflows after 60 days with no repository
#   activity; re-enable it in the Actions tab if that happens.
# - A 24/7 free Render service uses ~730 of the 750 free instance hours/month.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-awake
  cancel-in-progress: true

jobs:
  ping:
    if: github.repository == 'Kigena/neurotrace-academy'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping /health (waits for a cold start if the service is asleep)
        run: |
          url="https://neurolinea-api.onrender.com/health"
          for attempt in 1 2 3 4; do
            body=$(curl -fsS --max-time 75 "$url") && {
              echo "attempt $attempt: $body"
              echo "$body" | grep -q '"mongodb":"connected"' || echo "::warning::API up but MongoDB not connected"
              exit 0
            }
            echo "attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          echo "::error::API did not respond after 4 attempts"
          exit 1
